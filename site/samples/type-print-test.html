<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>본문 인쇄 비교 · DeepSearch</title><link rel="stylesheet" href="specimens.css"><link rel="stylesheet" href="refinements.css"><style>

</style></head><body><nav class="test-nav"><a href="library.html">라이브러리</a> / 본문 인쇄 비교 <button onclick="window.print()">3페이지 인쇄</button><p>인쇄 배율 100% · 실제 크기 · 브라우저 머리글/바닥글 해제. A → B는 굵기만, B → C는 크기만 달라집니다.</p></nav><main id="tests"></main><script>
const cases=[['A','현재 설정','설명문 10pt / 표 9.5pt / 질문 강조의 계산 굵기 900',''],['B','굵기만 정리','설명문 10pt / 표 9.5pt / 강조 600 · 본문 400','fixed'],['C','본문도 축소','설명문·표 9pt / 강조 600 · 본문 400','fixed smaller']];
document.getElementById('tests').innerHTML=cases.map(([id,title,desc,cls])=>`<article class="sheet test-page ${cls}"><div class="running"><strong>DeepSearch</strong><span>인쇄 비교 · 0.0.1 PILOT</span></div><div class="chapter">TYPE TEST / ${id}</div><h2>${id} · ${title}</h2><p class="deck">${desc}</p><div class="samples"><section><h3>설명문 · 같은 내용으로 비교합니다</h3><p class="test-paragraph">기업은 외주 생산한 생활용품을 온라인과 도매로 판매합니다. 도매 계약상 지급기한은 납품 후 45일이나, 실제 입금 이력은 확보되지 않았습니다. <strong>약정과 실제 회수기간을 구분해야 합니다.</strong> 회수가 늦어지면 재고 매입에 사용한 자금이 묶여 원리금 상환에 쓸 현금이 줄어들 수 있습니다.</p></section><section><h3>근거 연결형 확인 목록</h3><table class="test-table"><colgroup><col style="width:27%"><col style="width:43%"><col style="width:30%"></colgroup><thead><tr><th>확인할 내용</th><th>현재 근거와 확인 이유</th><th>필요 자료</th></tr></thead><tbody><tr><td><strong>매출이 실제로<br>회수되었습니까?</strong></td><td><strong>근거</strong> 월별 매출만 제시되었습니다.<br><strong>이유</strong> 상환에 쓸 현금인지 확인하려면 실제 입금과 대조해야 합니다.</td><td>거래처별 채권·입금 명세</td></tr><tr><td><strong>가용 현금에<br>제약이 있습니까?</strong></td><td><strong>근거</strong> 장부 잔액만 확인됩니다.<br><strong>이유</strong> 지급에 사용할 수 없는 예금을 제외해야 합니다.</td><td>통장·예금 제한 내역</td></tr><tr><td><strong>기존 원리금은<br>언제 상환합니까?</strong></td><td><strong>근거</strong> 차입금 총액만 제시되었습니다.<br><strong>이유</strong> 월별 지급 집중과 현금 유입 시점을 비교해야 합니다.</td><td>차입금·상환 일정표</td></tr></tbody></table></section><section><h3>숫자와 한글의 농도</h3><p class="test-paragraph">매출액 1,200백만원 · 영업이익 180백만원 · 영업이익률 15.0%<br>현금 잔액 300백만원 / 지급 예정 400백만원 / 단순 차액 100백만원</p></section></div><p class="test-notes">가상 자료 · 디자인 비교용입니다. 세 페이지는 동일한 내용·색상·여백·행간 비율을 사용합니다. Regular를 회색으로 바꾸거나 Light로 대체하지 않았습니다. 프린터의 토너 농도·절약 모드·용지 차이는 별도 확인이 필요합니다.</p><footer class="foot"><span>Pretendard · A4 · 100% 인쇄 비교</span><span>${id}</span></footer></article>`).join('');
</script></body></html>
