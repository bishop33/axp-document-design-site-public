<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>문서 디자인 가이드로 이동</title><noscript><meta http-equiv="refresh" content="0;url=/axp-document-design-site-public/docs/records/notes/measure/"></noscript><script>function mapLegacyRoute(page, hash) {
  const [path, search = ''] = (hash || '').replace(/^#/, '').split('?')
  const [key, rawId] = path.split('/')
  const id = rawId ? decodeURIComponent(rawId) : ''
  const q = search ? '?' + search : ''
  if (page === 'study') {
    if (!key || key === 'notes') return `/docs/records/notes/${id || 'measure'}/`
    if (key === 'grids') return '/docs/records/grid-experiment/'
    if (key === 'sources') return `/docs/records/sources/${id ? '#source-' + id : ''}`
    if (['experiments', 'reviews'].includes(key)) return `/docs/records/${key}/`
    return '/docs/records/notes/measure/'
  }
  switch (key) {
    case '':
    case undefined:
      return '/docs/'
    case 'basics':
    case 'notes':
      return !id || id === 'context' ? '/docs/start/print-and-presentation/' : `/docs/basics/${id}/`
    case 'grids':
      return `/docs/layout/grids/${q}`
    case 'system':
      return `/docs/layout/grids/${id}/`
    case 'examples':
      return `/docs/layout/examples/${q}`
    case 'example':
    case 'grid':
      return `/docs/layout/examples/${id}/${q}`
    case 'reference':
      return '/docs/layout/source-observations/'
    case 'references': {
      const params = new URLSearchParams(search)
      params.delete('from')
      return `/docs/references/${id ? id + '/' : ''}${params.size && !id ? '?' + params : ''}`
    }
    case 'charts':
      return '/docs/charts/'
    case 'chart':
      return `/docs/charts/${id}/`
    case 'team':
      return '/docs/team/'
    case 'sources':
    case 'reviews':
    case 'experiments':
      return mapLegacyRoute('study', hash)
    default:
      return '/docs/'
  }
};location.replace("/axp-document-design-site-public"+mapLegacyRoute("study",location.hash))</script></head><body><p><a href="/axp-document-design-site-public/docs/records/notes/measure/">문서 디자인 가이드로 이동</a></p></body></html>
