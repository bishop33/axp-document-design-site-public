<svg class="d" viewBox="0 0 640 268" role="img" aria-label="시장 범위(TAM·SAM·SOM)" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Pretendard,'Apple SD Gothic Neo',Arial,sans-serif;fill:#222}.title{font-size:12.7px;font-weight:600}.small{font-size:11.75px;fill:#555}.white{fill:#fff}.muted{fill:#ddd}</style><defs><marker id="arrow-market-sizing-wide" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#555"/></marker></defs><rect width="640" height="268" fill="#fff"/><rect x="8" y="8" width="624" height="232" fill="#f4f4f4" stroke="none"/><text x="24" y="34" class="title" text-anchor="start">TAM · 국내 기업용 데이터 분석 시장</text><text x="616" y="34" class="title" text-anchor="end">2.6조원</text><rect x="40" y="52" width="560" height="172" fill="#e4e4e4" stroke="none"/><text x="56" y="78" class="title" text-anchor="start">SAM · 금융·제조 업종의 클라우드 분석</text><text x="584" y="78" class="title" text-anchor="end">1.1조원</text><rect x="72" y="96" width="496" height="112" fill="#303030" stroke="#303030"/><text x="320" y="144" class="title white" text-anchor="middle">SOM · 3년 내 확보 목표 900억원</text><text x="320" y="168" class="small muted" text-anchor="middle">점유율 8% 가정</text><text x="8" y="260" class="small" text-anchor="start">면적은 시장 규모에 비례하지 않습니다. 각 층의 산정 근거와 기준 연도를 표 또는 주석에 적습니다.</text></svg>