<svg class="d" viewBox="0 0 640 288" role="img" aria-label="현행·개선 비교(AS-IS/TO-BE)" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Pretendard,'Apple SD Gothic Neo',Arial,sans-serif;fill:#222}.title{font-size:12.7px;font-weight:600}.small{font-size:11.75px;fill:#555}.white{fill:#fff}.muted{fill:#ddd}</style><defs><marker id="arrow-as-is-to-be-wide" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#555"/></marker></defs><rect width="640" height="288" fill="#fff"/><rect x="8" y="8" width="290" height="272" fill="#fafafa" stroke="#ddd"/><rect x="8" y="8" width="290" height="30" fill="#ddd" stroke="none"/><text x="153" y="29" class="title" text-anchor="middle">현행</text><rect x="342" y="8" width="290" height="272" fill="#f3f3f3" stroke="#ddd"/><rect x="342" y="8" width="290" height="30" fill="#ddd" stroke="none"/><text x="487" y="29" class="title" text-anchor="middle">개선</text><rect x="28" y="54" width="250" height="60" fill="#fff" stroke="#999"/><text x="153" y="80" class="title" text-anchor="middle">엑셀로 자료 취합</text><text x="153" y="100" class="small" text-anchor="middle">부서별 이메일</text><rect x="28" y="134" width="250" height="60" fill="#fff" stroke="#999"/><text x="153" y="160" class="title" text-anchor="middle">수작업 검증</text><text x="153" y="180" class="small" text-anchor="middle">평균 3일</text><rect x="28" y="214" width="250" height="60" fill="#fff" stroke="#999"/><text x="153" y="240" class="title" text-anchor="middle">보고서 작성</text><text x="153" y="260" class="small" text-anchor="middle">담당자 2명</text><rect x="362" y="54" width="250" height="60" fill="#f2f2f2" stroke="#aaa"/><text x="487" y="80" class="title" text-anchor="middle">자동 수집</text><text x="487" y="100" class="small" text-anchor="middle">시스템 연계</text><rect x="362" y="134" width="250" height="60" fill="#303030" stroke="#303030"/><text x="487" y="160" class="title white" text-anchor="middle">규칙 기반 검증</text><text x="487" y="180" class="small