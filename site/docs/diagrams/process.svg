or="middle">확인합니다.</text><path d="M303 110H324" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arrow-process-wide)"/><rect x="324" y="8" width="137" height="220" fill="#fff" stroke="#aaa"/><rect x="324" y="8" width="137" height="33" fill="#e8e8e8" stroke="none"/><text x="335" y="30" class="title" text-anchor="start">03 충전·포장</text><g transform="translate(363,68) scale(.65)"><g stroke="#444" stroke-width="2" fill="#eee"><path d="M8 22H31V78H8ZM53 22H76V78H53Z"/><path d="M13 8H26V22H13ZM58 8H71V22H58Z" fill="white"/><path d="M1 87H87M0 0H87V10M19 0V8M64 0V8" fill="none"/></g></g><text x="392" y="156" class="title" text-anchor="middle">충전 설비</text><text x="392" y="183" class="small" text-anchor="middle">용기에 담고</text><text x="392" y="204" class="small" text-anchor="middle">포장합니다.</text><path d="M461 110H482" fill="none" stroke="#555" stroke-width="1.4"  marker-end="url(#arrow-process-wide)"/><rect x="482" y="8" width="137" height="220" fill="#fff" stroke="#aaa"/><rect x="482" y="8" width="137" height="33" fill="#e8e8e8" stroke="none"/><text x="493" y="30" class="title" text-anchor="start">04 출하 검사</text><g transform="translate(521,68) scale(.65)"><g fill="none" stroke="#444" stroke-width="2"><rect x="10" y="8" width="65" height="79"/><path d="M27 4H58V16H27Z" fill="#ddd"/><path d="M24 37L30 43L40 31M47 37H63M24 62L30 68L40 56M47 62H63"/></g></g><text x="550" y="156" class="title" text-anchor="middle">검사 기록</text><text x="550" y="183" class="small" text-anchor="middle">검사를 마친 제품의</text><text x="550" y="204" class="small" text-anchor="middle">출하를 승인합니다.</text></svg>